name: Release (imagens GHCR)

# ÚNICO workflow de publicação. Imagens só saem quando uma release é publicada no GitHub ou por disparo manual; nada
# publica em push a main/develop (develop e PRs rodam apenas o CI, em ci.yml). A automação (release) só constrói se a
# release for da main; o disparo manual não tem trava de branch e usa a branch escolhida na interface. Não existe mais deploy automático por SSH:
# o deploy é feito manualmente na VPS, puxando as imagens desta release.
#
# NUNCA em pull_request: o token deste workflow tem permissão de escrita em pacotes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.9.0). As imagens também recebem 'latest'."
        required: true
        type: string

concurrency:
  group: release-ghcr-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false # não interrompe uma publicação em andamento

permissions:
  contents: read

jobs:
  # Stack mínimo distribuível: sem qualquer uma destas 3 imagens, quem faz `docker pull` não consegue rodar o Watink de
  # verdade — watink-business sem watink-engine não conecta WhatsApp (o engine é o cliente whatsmeow); postgres vanilla
  # não tem PostGIS+pgvector, então watink-postgres é quem carrega essas extensões pré-instaladas.
  # O código já passou pelo ci.yml no PR; os Dockerfiles compilam (go build) dentro do próprio build.
  build-and-push:
    if: github.event_name != 'release' || github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: watink-business
            dockerfile: Dockerfile.business
            context: .
          - image: watink-engine
            dockerfile: engine-go/Dockerfile
            context: .
          - image: watink-postgres
            dockerfile: infra/postgres/Dockerfile
            context: ./infra/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          # Em release, constrói exatamente a tag publicada; no disparo manual, o ref escolhido na interface.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # O nome do pacote no GHCR é sempre minúsculo; o dono é o do repositório que roda o workflow (fork ou upstream).
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/${{ matrix.image }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$EVENT" = "release" ]; then
            VERSION="$RELEASE_TAG"
            LATEST=true
            [ "$PRERELEASE" = "true" ] && LATEST=false # pré-release nunca vira latest
          else
            VERSION="$INPUT_TAG"
            LATEST=true
          fi
          # Docker não aceita tag com '/' nem começando por '.' ou '-': normaliza o que o operador digitou.
          VERSION="$(printf '%s' "$VERSION" | sed 's#[^A-Za-z0-9_.-]#-#g; s#^[.-]*##')"
          [ -n "$VERSION" ] || { echo "tag vazia após normalizar" >&2; exit 1; }
          TAGS="${IMAGE}:${VERSION},${IMAGE}:sha-${SHORT_SHA}"
          [ "$LATEST" = "true" ] && TAGS="${TAGS},${IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
